version: '3.8'

services:
  ghost:
    image: ghost:5-alpine
    restart: always
    ports:
      - "2368:2368"
    environment:
      database__client: mysql
      database__connection__host: db
      database__connection__user: root
      database__connection__password: ghost_db_password
      database__connection__database: ghost
      url: http://localhost:2368
    volumes:
      - ghost_data:/var/lib/ghost/content
    depends_on:
      - db

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ghost_db_password
      MYSQL_DATABASE: ghost
    volumes:
      - db_data:/var/lib/mysql

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - path: ./frontend/.env.local
        required: false
    depends_on:
      - ghost

  chatbot:
    build: ./chatbot
    restart: always
    ports:
      - "8501:8501"
    env_file:
      - path: ./chatbot/.env
        required: false
    depends_on:
      - ghost

volumes:
  ghost_data:
  db_data:
