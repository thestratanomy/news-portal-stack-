version: '3.8'

services:
  ghost:
    image: ghost:5-alpine
    restart: always
    ports:
      - "2368:2368"
    environment:
      database__client: mysql
      database__connection__host: db
      database__connection__user: root
      database__connection__password: ghost_db_password
      database__connection__database: ghost
      url: http://localhost:2368
    volumes:
      - ghost_data:/var/lib/ghost/content
    depends_on:
      - db

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ghost_db_password
      MYSQL_DATABASE: ghost
    volumes:
      - db_data:/var/lib/mysql

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_GHOST_ADMIN_URL: ${NEXT_PUBLIC_GHOST_ADMIN_URL:-http://localhost:2368}
        NEXT_PUBLIC_STREAMLIT_URL: ${NEXT_PUBLIC_STREAMLIT_URL:-http://localhost:8501}
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.local
    depends_on:
      - ghost

  chatbot:
    build: ./chatbot
    restart: always
    ports:
      - "8501:8501"
    env_file:
      - ./chatbot/.env
    depends_on:
      - ghost

volumes:
  ghost_data:
  db_data:
