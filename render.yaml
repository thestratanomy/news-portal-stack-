services:
  - type: web
    name: ghost-cms
    runtime: image
    image:
      url: docker.io/library/ghost:5-alpine
    plan: free
    envVars:
      - key: database__client
        value: mysql
      - key: database__connection__host
        sync: false
      - key: database__connection__port
        sync: false
      - key: database__connection__user
        value: avnadmin
      - key: database__connection__password
        sync: false
      - key: database__connection__database
        value: defaultdb
      - key: database__connection__ssl__rejectUnauthorized
        value: "true"
      - key: database__connection__ssl__ca
        sync: false
      - key: url
        sync: false
    disk:
      name: ghost-content
      mountPath: /var/lib/ghost/content
      sizeGB: 1
